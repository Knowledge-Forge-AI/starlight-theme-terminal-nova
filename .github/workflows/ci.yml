name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: terminal-nova-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: Public staging source policy and receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate PR source policy
        env:
          TFSB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          TFSB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TFSB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TFSB_EVENT_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$TFSB_BASE_REF" != "main" ]; then
            echo "::error::Base ref must be main, got $TFSB_BASE_REF"
            exit 1
          fi
          if [ "$TFSB_HEAD_REF" != "staging" ]; then
            echo "::error::Head ref must be staging, got $TFSB_HEAD_REF"
            exit 1
          fi
          if [ "$TFSB_HEAD_REPOSITORY" != "$TFSB_EVENT_REPOSITORY" ]; then
            echo "::error::PR must originate from the same repository, got $TFSB_HEAD_REPOSITORY"
            exit 1
          fi
      - name: Checkout exact staging head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record staging head receipt
        run: |
          mkdir -p .test-reports/source-policy
          node tools/ci/exact-head.mjs --output .test-reports/source-policy/receipt.json --expected-branch staging --expected-base main --checkout-role staging-head
      - name: Bind source policy receipt
        run: node tools/ci/artifact-manifest.mjs --root .test-reports/source-policy --output .test-reports/source-policy/artifact-manifest.json --job source-policy --require receipt.json
      - name: Upload source policy receipt
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: source-policy-receipt
          path: .test-reports/source-policy/
          if-no-files-found: error
          retention-days: 14

  theme-package:
    name: Terminal Nova composed release package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: source-policy
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Record exact-head receipt
        run: |
          mkdir -p .test-reports/theme-package
          node tools/ci/exact-head.mjs --output .test-reports/theme-package/receipt.json --expected-branch staging --expected-base main --checkout-role merge-candidate
      - name: Verify selected release source metadata
        run: |
          node --check index.js
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(p.version!=="0.1.0" || p.private!==false || p.publishConfig?.access!=="public") throw Error("release metadata");'
          cp provenance.json .test-reports/theme-package/theme-manifest.json
      - name: Pack the composed release package
        run: |
          npm pack --pack-destination .test-reports/theme-package --json > .test-reports/theme-package/pack-manifest.json
          mv .test-reports/theme-package/*.tgz .test-reports/theme-package/theme-package.tgz
      - name: Audit the owning locked demo dependencies
        run: npm audit --prefix demo --json > .test-reports/theme-package/audit-result.json
      - name: Bind theme package artifact bytes
        run: node tools/ci/artifact-manifest.mjs --root .test-reports/theme-package --output .test-reports/theme-package/artifact-manifest.json --job theme-package --require receipt.json --require theme-manifest.json --require pack-manifest.json --require theme-package.tgz --require audit-result.json
      - name: Upload theme package artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: theme-package-artifacts
          path: .test-reports/theme-package/
          if-no-files-found: error
          retention-days: 14

  demo:
    name: Self-contained Terminal Nova demo build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs:
      - source-policy
      - theme-package
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Record exact-head receipt
        run: |
          mkdir -p .test-reports/demo
          node tools/ci/exact-head.mjs --output .test-reports/demo/receipt.json --expected-branch staging --expected-base main --checkout-role merge-candidate
      - name: Download theme package artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: theme-package-artifacts
          path: .test-reports/theme-package/
      - name: Install demo dependencies and qualified theme package
        # The exact same-run npm archive is intentionally tested with lifecycle scripts disabled.
        run: | # zizmor: ignore[adhoc-packages]
          npm ci --prefix demo --ignore-scripts
          npm install --prefix demo --ignore-scripts --no-save --package-lock=false "$GITHUB_WORKSPACE/.test-reports/theme-package/theme-package.tgz"
      - name: Build self-contained demo
        run: npm --prefix demo run build
      - name: Verify installed release in both modes and viewports
        run: |
          npm exec --prefix demo -- playwright install --with-deps chromium
          node tools/smoke-generated-plugin.mjs --release-nova-root . --packed-theme .test-reports/theme-package/theme-package.tgz --work-dir "$RUNNER_TEMP/nova-consumer"
          cp "$RUNNER_TEMP/nova-consumer/release-consumer.json" .test-reports/demo/release-consumer.json
      - name: Archive demo distribution
        run: tar -czf .test-reports/demo/demo-dist.tar.gz -C demo/dist .
      - name: Bind demo artifact bytes
        run: node tools/ci/artifact-manifest.mjs --root .test-reports/demo --output .test-reports/demo/artifact-manifest.json --job demo --require receipt.json --require demo-dist.tar.gz
      - name: Upload demo artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: demo-artifacts
          path: .test-reports/demo/
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: Advanced CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: source-policy
    env:
      TFSB_LANGUAGE: ${{ matrix.language }}
      TFSB_MATRIX_JSON: '{"language":"${{ matrix.language }}"}'
      TFSB_CODEQL_REPORT_DIR: .test-reports/codeql-${{ matrix.language }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: actions
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Record exact-head receipt
        run: |
          mkdir -p "$TFSB_CODEQL_REPORT_DIR"
          node tools/ci/exact-head.mjs --output "$TFSB_CODEQL_REPORT_DIR/receipt.json" --expected-branch staging --expected-base main --checkout-role merge-candidate
      - name: Initialize CodeQL Action
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  supply-chain:
    name: Supply chain, Syft SBOMs, Grype scan, and audits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - source-policy
      - theme-package
      - demo
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Record exact-head receipt
        run: |
          mkdir -p .test-reports/supply-chain
          node tools/ci/exact-head.mjs --output .test-reports/supply-chain/receipt.json --expected-branch staging --expected-base main --checkout-role merge-candidate
      - name: Download product release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: ${{ runner.temp }}/tfsb-nova-supply/
      - name: Materialize Terminal Nova release surfaces
        shell: bash
        run: |
          set -euo pipefail
          TFSB_INPUT_DIR="$RUNNER_TEMP/tfsb-nova-supply"
          TFSB_RELEASE_DIR="$RUNNER_TEMP/tfsb-nova-release"
          rm -rf "$TFSB_RELEASE_DIR"
          mkdir -p "$TFSB_RELEASE_DIR/package" "$TFSB_RELEASE_DIR/demo"
          test -s "$TFSB_INPUT_DIR/theme-package-artifacts/theme-package.tgz"
          cp "$TFSB_INPUT_DIR/theme-package-artifacts/theme-package.tgz" "$TFSB_RELEASE_DIR/package/theme-package.tgz"
          node tools/ci/artifact-manifest.mjs --archive "$TFSB_INPUT_DIR/theme-package-artifacts/theme-package.tgz" --manifest "$TFSB_INPUT_DIR/theme-package-artifacts/artifact-manifest.json" --extract-to "$TFSB_RELEASE_DIR/package/extracted"
          test -s "$TFSB_INPUT_DIR/demo-artifacts/demo-dist.tar.gz"
          cp "$TFSB_INPUT_DIR/demo-artifacts/demo-dist.tar.gz" "$TFSB_RELEASE_DIR/demo/demo-dist.tar.gz"
          node tools/ci/artifact-manifest.mjs --archive "$TFSB_INPUT_DIR/demo-artifacts/demo-dist.tar.gz" --manifest "$TFSB_INPUT_DIR/demo-artifacts/artifact-manifest.json" --extract-to "$TFSB_RELEASE_DIR/demo/extracted"
          mkdir -p "$RUNNER_TEMP/tfsb-nova-inventory/demo"
          cp demo/package.json demo/package-lock.json "$RUNNER_TEMP/tfsb-nova-inventory/demo/"
      - name: Run Syft SBOM generation and Grype vulnerability scan
        run: |
          TFSB_RELEASE_DIR="$RUNNER_TEMP/tfsb-nova-release"
          node tools/ci/run-syft-grype.mjs --target "$TFSB_RELEASE_DIR" --output-dir .test-reports/supply-chain --name terminal-nova \
            --component-input "build-input:demo-lock=$RUNNER_TEMP/tfsb-nova-inventory/demo" \
            --component-catalogers demo-lock=javascript-lock-cataloger,javascript-package-cataloger
      - name: Run selected workflow and secret checks
        run: node tools/ci/run-workflow-checks.mjs --root . --output-dir .test-reports/workflow-checks
      - name: Retain workflow and secret check outputs
        run: |
          rm -rf .test-reports/supply-chain/workflow-checks
          mv .test-reports/workflow-checks .test-reports/supply-chain/workflow-checks
          find .test-reports/supply-chain -type f -size 0 -delete
      - name: Bind supply-chain artifacts
        run: |
          node tools/ci/artifact-manifest.mjs --root .test-reports/supply-chain --output .test-reports/supply-chain/artifact-manifest.json --job supply-chain --require receipt.json --require terminal-nova.syft.json --require terminal-nova.spdx.json --require terminal-nova.cdx.json --require terminal-nova.grype.json --require terminal-nova.grype.sarif --require terminal-nova.receipt.json --require workflow-checks/actionlint.result.json --require workflow-checks/zizmor.result.json --require workflow-checks/betterleaks.result.json --require workflow-checks/workflow-checks.receipt.json --require workflow-checks/betterleaks.report.json
      - name: Upload supply chain artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: supply-chain-artifacts
          path: .test-reports/supply-chain/
          if-no-files-found: error
          retention-days: 14

  evidence-aggregate:
    name: Evidence aggregation and qualification gate
    runs-on: ubuntu-24.04
    if: always()
    env:
      TFSB_NEEDS_JSON: ${{ toJson(needs) }}
    timeout-minutes: 15
    needs:
      - source-policy
      - theme-package
      - demo
      - codeql
      - supply-chain
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Record exact-head receipt
        run: |
          mkdir -p .test-reports/evidence-aggregate
          node tools/ci/exact-head.mjs --output .test-reports/evidence-aggregate/receipt.json --expected-branch staging --expected-base main --checkout-role merge-candidate
      - name: Download all job artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: .downloaded-artifacts/
      - name: Aggregate evidence and generate qualification manifest
        run: |
          node tools/ci/evidence-aggregator.mjs --download-dir .downloaded-artifacts --output-dir .test-reports/evidence-aggregate --product terminal-nova --expected-receipt .test-reports/evidence-aggregate/receipt.json --needs-json "$TFSB_NEEDS_JSON"
      - name: Upload evidence aggregate artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: evidence-aggregate-artifacts
          path: .test-reports/evidence-aggregate/
          if-no-files-found: error
          retention-days: 14
