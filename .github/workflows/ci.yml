name: CI
on: [pull_request, push]
permissions:
  contents: read
jobs:
  installed-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22.23.2
      - run: node tools/verify-release.mjs
      - run: node --test tools/verify-release.test.mjs
      - run: npm pack --ignore-scripts
      - run: npm ci --ignore-scripts --prefix demo
      # Installs the verified package packed above; demo dependencies came from npm ci.
      - run: npm install --ignore-scripts --prefix demo ./knowledge-forge-ai-starlight-theme-terminal-nova-0.3.0.tgz # zizmor: ignore[adhoc-packages] -- exact local candidate under test
      - run: npm run build --prefix demo
      - run: npm audit --omit=dev --prefix demo
      - run: node tools/ci/run-syft-grype.mjs --target knowledge-forge-ai-starlight-theme-terminal-nova-0.3.0.tgz --output-dir .test-reports/supply-chain --tools-dir "$RUNNER_TEMP/security-tools" --name terminal-nova
      - run: node tools/ci/finding-ratchet.mjs --baseline tools/ci/finding-ratchet-baseline.json --input .test-reports/supply-chain/terminal-nova.grype.sarif --product terminal-nova --tool grype --check
